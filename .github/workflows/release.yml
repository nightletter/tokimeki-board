  # macos x64 빌드 (self-hosted)
  build-x64:
#    needs: test
    name: Build macOS (x64)
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python Version
        run: python3 --version

      - name: Build and Compress
        run: |
          chmod +x scripts/build_macos.sh
          TARGET_ARCH=x64 ./scripts/build_macos.sh
          tar -czf "dist/${{ env.APP_NAME }}-macos-x64.tar.gz" -C dist "${{ env.APP_NAME }}.app"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: dist/${{ env.APP_NAME }}-macos-x64.tar.gz

